/* Fusiona materias guardadas en localStorage con CAMPOS / CONTENIDOS / PDA_MAP.
   Usa .includes para evitar duplicados si se re-aplica.                         */
function applyCustomMaterias(customs) {
  (customs || []).forEach(m => {
    if (!m || !m.asignatura) return;
    const campoId = m.campoFormativo || "De lo humano y lo comunitario";
    let campo = CAMPOS.find(c => c.id === campoId);
    if (!campo) {
      campo = { id: campoId, label: m.campoLabel || campoId, asignaturas: [] };
      CAMPOS.push(campo);
    }
    if (!campo.asignaturas.includes(m.asignatura)) {
      campo.asignaturas.push(m.asignatura);
    }
    if (Array.isArray(m.contenidos) && m.contenidos.length) {
      const prev = CONTENIDOS[m.asignatura] || [];
      const merged = [...prev];
      m.contenidos.forEach(c => { if (c && !merged.includes(c)) merged.push(c); });
      CONTENIDOS[m.asignatura] = merged;
    }
    if (Array.isArray(m.pdas) && m.pdas.length) {
      const prev = PDA_MAP[m.asignatura] || [];
      const merged = [...prev];
      m.pdas.forEach(c => { if (c && !merged.includes(c)) merged.push(c); });
      PDA_MAP[m.asignatura] = merged;
    }
  });
}

/* Estado global de sincronización, para mostrar un indicador en la UI */
const syncListeners = new Set();
const syncState = { pending: 0, error: null };
const notifySync = () => syncListeners.forEach(fn => fn({ ...syncState }));
const useSyncStatus = () => {
  const [s, setS] = useState({ ...syncState });
  useEffect(() => {
    syncListeners.add(setS);
    return () => syncListeners.delete(setS);
  }, []);
  return s;
};

/* Reemplaza al antiguo useLS: guarda/lee en Firebase Realtime Database bajo
   "planeaFacil/<k>", usando localStorage sólo como caché para pintar rápido
   mientras llega la primera respuesta de la nube. Como no hay login, todos
   los dispositivos comparten el mismo nodo.

   MIGRACIÓN: si la nube todavía no tiene datos para esta clave (primera vez
   que corre esta versión) pero SÍ hay datos guardados en localStorage de la
   versión anterior (sin Firebase), esos datos locales se suben una sola vez
   a la nube en lugar de reemplazarse por el valor vacío inicial. */
const useCloudState = (k, init) => {
  const path = "planeaFacil/" + k;
  const localSnapshot = useRef(undefined); // valor leído de localStorage al montar, antes de tocar la nube
  const migrated = useRef(false);

  const [v, setV] = useState(() => {
    try {
      const s = localStorage.getItem(k);
      const parsed = s ? JSON.parse(s) : undefined;
      localSnapshot.current = parsed;
      return parsed !== undefined ? parsed : init;
    } catch { return init; }
  });

  useEffect(() => {
    if (!db) return;
    const ref = db.ref(path);
    const onVal = snap => {
      const val = snap.val();
      if ((val === null || val === undefined) && !migrated.current) {
        // La nube está vacía. Si había datos locales previos (de antes de
        // usar Firebase), los subimos ahora para no perderlos.
        migrated.current = true;
        const local = localSnapshot.current;
        const hasLocalData = local !== undefined && local !== null &&
          !(Array.isArray(local) && local.length === 0) &&
          !(typeof local === "object" && !Array.isArray(local) && Object.keys(local).length === 0);
        if (hasLocalData) {
          db.ref(path).set(local).catch(err => console.error("Migración a Firebase (" + path + "):", err));
          setV(local);
          return;
        }
        setV(init);
        try { localStorage.setItem(k, JSON.stringify(init)); } catch {}
        return;
      }
      migrated.current = true;
      const next = (val === null || val === undefined) ? init : val;
      setV(next);
      try { localStorage.setItem(k, JSON.stringify(next)); } catch {}
    };
    const onErr = err => {
      console.error("Firebase (" + path + "):", err);
      syncState.error = err.message || String(err);
      notifySync();
    };
    ref.on("value", onVal, onErr);
    return () => ref.off("value", onVal);
  }, [path]);

  const setCloud = (next) => {
    setV(prev => {
      const resolved = typeof next === "function" ? next(prev) : next;
      try { localStorage.setItem(k, JSON.stringify(resolved)); } catch {}
      if (db) {
        syncState.pending++; syncState.error = null; notifySync();
        db.ref(path).set(resolved)
          .catch(err => { syncState.error = err.message || String(err); console.error("Firebase (" + path + "):", err); })
          .finally(() => { syncState.pending = Math.max(0, syncState.pending - 1); notifySync(); });
      }
      return resolved;
    });
  };

  return [v, setCloud];
};

/* ── CARGA MASIVA: utilidades CSV ─────────────────────────────────────────────
   Formato esperado (columnas, en este orden):
   Tema, Actividad, Inicio, Desarrollo, Cierre, PDA
   - "Tema": si ya existe (mismo nombre, sin importar mayúsculas) se reutiliza y
     la actividad se agrega dentro de él; si no existe, se crea.
   - "Actividad" respeta el orden de campos: nombre, inicio, desarrollo, cierre.
   - "PDA": si el texto ya existe en el banco de PDAs del Nivel/Grado/Asignatura
     seleccionado, se ignora (evita duplicados); si es nuevo, se une a la lista
     ya existente sin borrar los PDAs previos.
──────────────────────────────────────────────────────────────────────────── */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  const clean = (text||"").replace(/^\ufeff/, "");
  for (let i = 0; i < clean.length; i++) {
    const c = clean[i];
    if (inQuotes) {
      if (c === '"') {
        if (clean[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* ignore, \n handles the break */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => (c||"").trim() !== ""));
}

function parseBulkTopicsCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { error: "El archivo está vacío." };
  const header = rows[0].map(h => (h||"").trim().toLowerCase());
  const findCol = (...names) => names.map(n => header.indexOf(n)).find(i => i >= 0) ?? -1;
  const idx = {
    tema: findCol("tema"),
    actividad: findCol("actividad", "nombre de la actividad"),
    inicio: findCol("inicio"),
    desarrollo: findCol("desarrollo"),
    cierre: findCol("cierre"),
    pda: findCol("pda", "pdas"),
  };
  if (idx.tema < 0 || idx.actividad < 0) {
    return { error: "El archivo debe tener al menos las columnas 'Tema' y 'Actividad'. Descarga la plantilla para ver el formato correcto." };
  }
  const records = rows.slice(1).map(r => ({
    tema: (r[idx.tema]||"").trim(),
    actividad: (r[idx.actividad]||"").trim(),
    inicio: idx.inicio>=0 ? (r[idx.inicio]||"").trim() : "",
    desarrollo: idx.desarrollo>=0 ? (r[idx.desarrollo]||"").trim() : "",
    cierre: idx.cierre>=0 ? (r[idx.cierre]||"").trim() : "",
    pda: idx.pda>=0 ? (r[idx.pda]||"").trim() : "",
  })).filter(rec => rec.tema && rec.actividad);
  if (!records.length) return { error: "No se encontraron filas válidas (revisa que 'Tema' y 'Actividad' no estén vacíos)." };
  return { records };
}

/* Utilidades de color: generan una paleta armónica a partir de un solo color de acento */
function hexToHsl(hex) {
  hex = (hex||"#1B6CA8").replace("#","");
  if (hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const r=parseInt(hex.slice(0,2),16)/255, g=parseInt(hex.slice(2,4),16)/255, b=parseInt(hex.slice(4,6),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
  if (max===min) { h=s=0; }
  else {
    const d=max-min; s = l>0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h/=6;
  }
  return [h*360, s*100, l*100];
}
function hslToHex(h,s,l) {
  h=((h%360)+360)%360; s=Math.max(0,Math.min(100,s))/100; l=Math.max(0,Math.min(100,l))/100;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  let r,g,b;
  if (h<60){r=c;g=x;b=0;} else if (h<120){r=x;g=c;b=0;} else if (h<180){r=0;g=c;b=x;}
  else if (h<240){r=0;g=x;b=c;} else if (h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  const toHex=v=>Math.round((v+m)*255).toString(16).padStart(2,"0");
  return "#"+toHex(r)+toHex(g)+toHex(b);
}
function paletteFromAccent(accent) {
  const [h] = hexToHsl(accent);
  const tone = (dh, s=58, l=36, ls=94) => ({
    bg: hslToHex(h+dh, s, l),
    lt: hslToHex(h+dh, Math.max(s-30,12), ls),
    bd: hslToHex(h+dh, Math.max(s-10,20), Math.max(ls-16,72)),
  });
  return {
    gen:  {bg:accent, lt:hslToHex(h,22,95), bd:hslToHex(h,32,82)},
    det:  tone(38),
    prop: tone(-52),
    seq:  tone(14),
    rec:  tone(-98, 55, 40),
    ini:  hslToHex(h+38, 55, 33),
    des:  hslToHex(h, 55, 30),
    cie:  hslToHex(h-98, 55, 36),
    stripe:[accent, hslToHex(h+38,55,44), hslToHex(h-52,55,44), hslToHex(h+70,55,44), hslToHex(h-98,55,44), hslToHex(h+14,55,44)],
  };
}

const ImportExportModal = ({ plans, onImport, customMaterias, onCustomMateriasChange, onClose }) => {
  const [msg, setMsg] = useState("");
  const [mode, setMode] = useState("menu"); // menu | confirm | materiaConfirm
  const [importedData, setImportedData] = useState(null);
  const [importedMaterias, setImportedMaterias] = useState(null); // array of materia objects
  const fileRef = useRef();
  const materiaFileRef = useRef();

  const doExport = () => {
    const data = { version:"NES-1.0", exportDate:new Date().toISOString(), plans };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url;
    a.download = "PlaneacionesNES_"+new Date().toLocaleDateString("es-MX").replace(/\//g,"-")+".json";
    a.click(); URL.revokeObjectURL(url);
    setMsg("✅ Exportación completada — " + plans.length + " planeaciones guardadas.");
  };

  const handleFile = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (!parsed.plans || !Array.isArray(parsed.plans)) throw new Error("Formato inválido");
        setImportedData(parsed);
        setMode("confirm");
      } catch { setMsg("❌ Archivo inválido. Asegúrate de usar el archivo exportado desde esta app."); }
    };
    reader.readAsText(f);
    e.target.value = "";
  };

  const doImport = (merge) => {
    if (!importedData) return;
    if (merge) {
      const existing = new Set(plans.map(p=>p.id));
      const newOnes = importedData.plans.filter(p => !existing.has(p.id));
      onImport([...newOnes, ...plans]);
      setMsg("✅ Se importaron "+newOnes.length+" planeaciones nuevas (duplicados ignorados).");
    } else {
      onImport(importedData.plans);
      setMsg("✅ Base de datos reemplazada con "+importedData.plans.length+" planeaciones.");
    }
    setMode("menu");
  };

  /* ── NUEVO: importar materia ─────────────────────────────────────────────── */
  // Normaliza el JSON a un array de materias válidas. Acepta:
  //   - { type:"materia", asignatura:"...", campoFormativo:"...", contenidos:[], pdas:[] }
  //   - { materias:[ {...}, {...} ] }
  //   - [ {...}, {...} ]  (array directo)
  //   - { asignatura:"...", ... } (objeto simple)
  const normalizeMaterias = (raw) => {
    let list = [];
    if (Array.isArray(raw)) list = raw;
    else if (raw && Array.isArray(raw.materias)) list = raw.materias;
    else if (raw && raw.asignatura) list = [raw];
    else return null;
    const valid = list.filter(m => m && typeof m.asignatura === "string" && m.asignatura.trim());
    return valid.length ? valid : null;
  };

  const handleMateriaFile = e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const mats = normalizeMaterias(parsed);
        if (!mats) throw new Error("Formato inválido");
        setImportedMaterias(mats);
        setMode("materiaConfirm");
        setMsg("");
      } catch {
        setMsg("❌ Archivo de materia inválido. Debe contener al menos los campos 'asignatura' y 'contenidos' o 'pdas'.");
      }
    };
    reader.readAsText(f);
    e.target.value = "";
  };

  const doImportMaterias = () => {
    if (!importedMaterias) return;
    // Aplicar en memoria (muta CAMPOS / CONTENIDOS / PDA_MAP) y persistir
    applyCustomMaterias(importedMaterias);
    const updated = [...(customMaterias || []), ...importedMaterias];
    onCustomMateriasChange(updated);
    setMsg("✅ Se agregaron "+importedMaterias.length+" materia(s). La información anterior se conservó.");
    setImportedMaterias(null);
    setMode("menu");
  };

  const downloadMateriaTemplate = () => {
    const tpl = {
      type: "materia",
      campoFormativo: "Saberes y pensamiento científico",
      asignatura: "Astronomía",
      contenidos: [
        "El sistema solar y sus componentes",
        "Fases de la Luna y eclipses",
        "Constelaciones y cartas celestes",
        "Exploración espacial"
      ],
      pdas: [
        "Identifica los planetas del sistema solar y sus características",
        "Explica los fenómenos astronómicos observables",
        "Valora la importancia de la astronomía en la cultura"
      ]
    };
    const blob = new Blob([JSON.stringify(tpl, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url;
    a.download = "plantilla_materia.json";
    a.click(); URL.revokeObjectURL(url);
  };

  const removeCustomMateria = (idx) => {
    if (!confirm("¿Quitar esta materia personalizada? Deberás recargar la página para que desaparezca de los menús.")) return;
    const updated = (customMaterias || []).filter((_,i) => i !== idx);
    onCustomMateriasChange(updated);
    setMsg("🗑️ Materia quitada. Recarga la página para actualizar los menús.");
  };

    const f = e.target.files[0]; if (!f) return;
    setLoading(true); setError("");
    try {
      const ab = await f.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: ab });
      const txt = result.value;
      const data = parseText(txt);
      const hasContent = Object.values(data).some(v => v && v.length > 3);
      if (!hasContent) { setError("No se encontraron secciones con ==ETIQUETA==. Asegúrate de usar la plantilla descargada y guardar como .docx"); setLoading(false); return; }
      setParsed(data);
      setStep("preview");
    } catch (err) {
      setError("Error al leer el archivo. Asegúrate de subir un archivo .docx (Word 2007+).");
    }
    setLoading(false);
  };

  const fieldLabels = {
    titulo:"Título", propositoGeneral:"Propósito General",
    propositosEspecificos:"Propósitos Específicos", aprendizajesEsperados:"Aprendizajes Esperados",
    inicio:"Inicio", desarrollo:"Desarrollo", cierre:"Cierre",
    recursos:"Recursos", instrumentosEvaluacion:"Instrumentos de Evaluación", criteriosEvaluacion:"Criterios de Evaluación",
  };

  return (
    <div style={{position:"fixed", inset:0, background:"#00000088", zIndex:600, display:"flex", alignItems:"center", justifyContent:"center", padding:16}}>
      <div style={{background:"#fff", borderRadius:18, width:"100%", maxWidth:580, maxHeight:"92vh", overflow:"auto", boxShadow:"0 20px 60px #0005"}}>

            <h2 style={{margin:0, fontSize:16, fontWeight:800}}>📝 Importar desde Plantilla Word</h2>
            <p style={{margin:"3px 0 0", fontSize:12, opacity:.85}}>Descarga, rellena y sube tu plantilla para llenar la planeación</p>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.2)", border:"none", color:"#fff", borderRadius:8, padding:"5px 11px", cursor:"pointer", fontSize:14}}>✕</button>
        </div>
        <div style={{padding:24}}>

          {step==="menu" && <>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:14, marginBottom:18}}>
              <div style={{border:"1.5px solid #a9dfbf", borderRadius:12, padding:18, textAlign:"center"}}>
                <div style={{fontSize:40, marginBottom:8}}>📄</div>
                <h3 style={{margin:"0 0 6px", fontSize:14, color:"#1e8449"}}>Paso 1: Descargar Plantilla</h3>
                <p style={{fontSize:12, color:"#555", margin:"0 0 14px", lineHeight:1.5}}>Descarga el formato .doc, ábrelo en Word, rellena cada sección y guárdalo como <b>.docx</b>.</p>
                <button onClick={downloadTemplate} style={{padding:"9px 16px", background:"#1e8449", color:"#fff", border:"none", borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:13, width:"100%"}}>⬇️ Descargar Plantilla</button>
              </div>
              <div style={{border:"1.5px solid #a9dfbf", borderRadius:12, padding:18, textAlign:"center"}}>
                <div style={{fontSize:40, marginBottom:8}}>⬆️</div>
                <h3 style={{margin:"0 0 6px", fontSize:14, color:"#1e8449"}}>Paso 2: Subir Plantilla</h3>
                <p style={{fontSize:12, color:"#555", margin:"0 0 14px", lineHeight:1.5}}>Sube el archivo .docx que llenaste. Los datos se colocarán en los campos correspondientes.</p>
                <button onClick={() => fileRef2.current.click()} disabled={loading} style={{padding:"9px 16px", background:loading?"#aaa":"#27ae60", color:"#fff", border:"none", borderRadius:9, cursor:loading?"not-allowed":"pointer", fontWeight:700, fontSize:13, width:"100%"}}>
                  {loading ? "⏳ Leyendo..." : "📂 Subir .docx"}
                </button>
                <input ref={fileRef2} type="file" accept=".docx,.doc" onChange={handleUpload} style={{display:"none"}} />
              </div>
            </div>
            {error && <div style={{background:"#fdecea", border:"1px solid #f5c6cb", borderRadius:10, padding:"10px 14px", fontSize:13, color:"#c0392b"}}>{error}</div>}
            <div style={{background:"#e8f4fd", border:"1px solid #a8d8ea", borderRadius:10, padding:"12px 14px", fontSize:12.5, color:"#1a5276", lineHeight:1.6}}>
              <b>📋 Instrucciones:</b><br/>
              1. Descarga la plantilla con el botón de arriba<br/>
              2. Ábrela en <b>Microsoft Word</b><br/>
              3. Escribe tu contenido en cada sección (entre las etiquetas ==)<br/>
              4. Guárdala como <b>.docx</b> (Archivo → Guardar como → .docx)<br/>
              5. Súbela con el botón "Subir .docx"<br/>
              6. Revisa la vista previa y confirma para aplicar los datos
            </div>
          </>}

          {step==="preview" && parsed && <>
            <div style={{background:"#eaf7f1", border:"1px solid #a9dfbf", borderRadius:10, padding:"10px 14px", marginBottom:16, fontSize:13, color:"#1e8449"}}>
              ✅ Plantilla leída correctamente. Revisa los datos antes de aplicarlos.
            </div>
            <div style={{maxHeight:350, overflow:"auto", border:"1px solid #e0ecf8", borderRadius:10, padding:14, marginBottom:16}}>
              {Object.entries(parsed).map(([k, v]) => v && (
                <div key={k} style={{marginBottom:12}}>
                  <div style={{fontWeight:700, fontSize:11, color:"#0072BB", textTransform:"uppercase", marginBottom:3}}>{fieldLabels[k]||k}</div>
                  <div style={{fontSize:12, color:"#444", background:"#f8f9fa", padding:"7px 10px", borderRadius:7, whiteSpace:"pre-wrap", maxHeight:80, overflow:"auto"}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{display:"flex", gap:10, justifyContent:"flex-end"}}>
              <button onClick={() => { setStep("menu"); setParsed(null); }} style={{padding:"10px 20px", background:"#ecf0f1", border:"none", borderRadius:10, cursor:"pointer", fontSize:13}}>← Volver</button>
              <button onClick={() => { onApply(parsed); onClose(); }} style={{padding:"10px 24px", background:"linear-gradient(135deg,#27ae60,#1abc9c)", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:800, fontSize:14}}>
                ✅ Aplicar a la Planeación
              </button>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
};

/* ── PRINT / PREVIEW MODAL ─────────────────────────────────────────────────── */
const PrintModal = ({ p, design, setDesign, onClose }) => {
  const [preview, setPreview] = useState(false);
  const [editDesign, setEditDesign] = useState(false);
  const html = buildDocHtml(p, design);

  const doPrint = () => {
    const w = window.open("", "_blank", "width=900,height=700");
    w.document.write(html);
    w.document.close();
    setTimeout(() => { w.focus(); w.print(); }, 500);
  };

  const doWord = () => {
    const blob = new Blob(["\ufeff", html], { type:"application/msword;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Planeacion_"+(p.titulo||"PleaFacil").replace(/\s+/g,"_").slice(0,40)+".doc";
    a.click();
    URL.revokeObjectURL(url);
  };

  if (editDesign) {
    return <DesignModal design={design} onSave={d=>{setDesign&&setDesign(d);}} onClose={() => setEditDesign(false)} />;
  }

  if (preview) {
    return (
      <div style={{position:"fixed", inset:0, background:"#0009", zIndex:600, display:"flex", flexDirection:"column"}}>
        <div style={{background:"#0072BB", padding:"10px 16px", display:"flex", alignItems:"center", gap:10}}>
          <span style={{color:"#fff", fontWeight:700, fontSize:14, flex:1}}>👁️ Vista Previa — {p.titulo||"Planeación"}</span>
          {setDesign && <button onClick={() => setEditDesign(true)} style={{padding:"7px 14px", background:"rgba(255,255,255,.2)", color:"#fff", border:"none", borderRadius:7, cursor:"pointer", fontWeight:700, fontSize:13}}>🎨 Diseño</button>}
          <button onClick={doPrint} style={{padding:"7px 16px", background:"#fff", color:"#0072BB", border:"none", borderRadius:7, cursor:"pointer", fontWeight:700, fontSize:13}}>🖨️ Imprimir / PDF</button>
          <button onClick={doWord} style={{padding:"7px 16px", background:"#1e5799", color:"#fff", border:"none", borderRadius:7, cursor:"pointer", fontWeight:700, fontSize:13}}>📄 Word</button>
          <button onClick={() => setPreview(false)} style={{padding:"7px 12px", background:"rgba(255,255,255,.2)", color:"#fff", border:"none", borderRadius:7, cursor:"pointer"}}>← Volver</button>
          <button onClick={onClose} style={{padding:"7px 12px", background:"rgba(255,255,255,.2)", color:"#fff", border:"none", borderRadius:7, cursor:"pointer"}}>✕ Cerrar</button>
        </div>
        <iframe srcDoc={html} style={{flex:1, border:"none", background:"#fff"}} title="Vista previa" />
      </div>
    );
  }

  return (
    <div style={{position:"fixed", inset:0, background:"#00000088", zIndex:600, display:"flex", alignItems:"center", justifyContent:"center"}}>
      <div style={{background:"#fff", borderRadius:16, padding:28, maxWidth:460, width:"90%", textAlign:"center", boxShadow:"0 20px 60px #0005"}}>
        <div style={{fontSize:42}}>🖨️</div>
        <h2 style={{margin:"8px 0 6px", color:"#0072BB"}}>Imprimir / Exportar</h2>
        <p style={{color:"#666", fontSize:13, marginBottom:6}}><b>"{p.titulo||"Sin título"}"</b></p>
        <p style={{color:"#888", fontSize:12, marginBottom:22}}>{p.nivel} {p.grado} {p.grupo&&'"'+p.grupo+'"'} · {p.asignatura||p.campoFormativo||"—"}</p>
        <div style={{display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap"}}>
          <button onClick={() => setPreview(true)} style={{padding:"10px 16px", background:"#2c3e50", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:600, fontSize:13}}>👁️ Vista Previa</button>
          {setDesign && <button onClick={() => setEditDesign(true)} style={{padding:"10px 16px", background:"#7d3c98", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13}}>🎨 Diseño</button>}
          <button onClick={doPrint} style={{padding:"10px 16px", background:"#0072BB", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13}}>🖨️ Imprimir / PDF</button>
          <button onClick={doWord} style={{padding:"10px 16px", background:"#1e5799", color:"#fff", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13}}>📄 Word</button>
          <button onClick={onClose} style={{padding:"10px 16px", background:"#ecf0f1", border:"none", borderRadius:8, cursor:"pointer", fontSize:13}}>Cancelar</button>
        </div>
      </div>
    </div>
  );
};



const TEMA_LIBRE_KEY = "__TEMA_LIBRE__";
const ContenidoSinteticoField = ({ val, set, opts }) => {
  const isLibre = val && !opts.includes(val);
  const [showInput, setShowInput] = React.useState(isLibre);
  const [textoLibre, setTextoLibre] = React.useState(isLibre ? val : "");

  const handleSel = v => {
    if (v === TEMA_LIBRE_KEY) {
      setShowInput(true);
      set(textoLibre || "");
    } else {
      setShowInput(false);
      setTextoLibre("");
      set(v);
    }
  };

  const selVal = showInput ? TEMA_LIBRE_KEY : (val || "");
  const allOpts = [...opts, "✏️ Agregar tema libre..."];

  return (
    <div>
      <select
        value={selVal}
        onChange={e => handleSel(e.target.value === "✏️ Agregar tema libre..." ? TEMA_LIBRE_KEY : e.target.value)}
        style={{...S, color: selVal ? "#2c3e50" : "#95a5a6"}}
      >
        <option value="">Selecciona un contenido...</option>
        {opts.map(o => <option key={o} value={o}>{o}</option>)}
        <option value={TEMA_LIBRE_KEY} style={{color:"#0072BB", fontWeight:600}}>✏️ Agregar tema libre...</option>
      </select>
      {showInput && (
        <div style={{marginTop:8, position:"relative"}}>
          <input
            type="text"
            value={textoLibre}
            onChange={e => { setTextoLibre(e.target.value); set(e.target.value); }}
            placeholder="Escribe el contenido o tema de tu planeación..."
            style={{...S, paddingRight:36, border:"1.5px solid #0072BB", background:"#f0f7ff"}}
            autoFocus
          />
          <span style={{position:"absolute", right:10, top:"50%", transform:"translateY(-50%)", fontSize:14}}>✏️</span>
        </div>
      )}
    </div>
  );
};

          <label style={{display:"block", fontWeight:700, fontSize:11, color:"#2c3e50", marginBottom:4, textTransform:"uppercase", letterSpacing:".4px"}}>
            1. Tema <span style={{fontSize:10, color:"#888", textTransform:"none", fontWeight:400}}>— {temas.length} disponible(s)</span>
          </label>
          <select value={selTema} onChange={e=>setSelTema(e.target.value)} style={{...S, color:selTema?"#2c3e50":"#95a5a6"}}>

/* ── CARGA MASIVA: modal ───────────────────────────────────────────────────── */
const BulkImportModal = ({ selNivel, selGrado, selAsig, existingTopics, existingPdas, onApply, onClose }) => {
  const [records, setRecords] = useState(null);
  const [error, setError] = useState("");
  const [fileName, setFileName] = useState("");
  const fileRef = useRef();

  const handleFile = e => {
    const f = e.target.files[0]; if (!f) return;
    setFileName(f.name); setError(""); setRecords(null);
    const reader = new FileReader();
    reader.onload = ev => {
      const res = parseBulkTopicsCSV(String(ev.target.result));
      if (res.error) { setError(res.error); return; }
      setRecords(res.records);
    };
    reader.onerror = () => setError("No se pudo leer el archivo.");
    reader.readAsText(f, "UTF-8");
    e.target.value = "";
  };

  // Vista previa: cuenta temas nuevos vs existentes, actividades nuevas vs duplicadas, PDAs nuevos vs ya existentes
  const preview = React.useMemo(() => {
    if (!records) return null;
    const topicNames = new Set(existingTopics.map(t => t.nombre.trim().toLowerCase()));
    const actKeyKnown = new Set();
    existingTopics.forEach(t => (t.actividades||[]).forEach(a => actKeyKnown.add(t.nombre.trim().toLowerCase()+"||"+a.nombre.trim().toLowerCase())));
    const pdaKnown = new Set(existingPdas.map(p => p.texto.trim().toLowerCase()));

    let newTopics = new Set(), reusedTopics = new Set(), newActs = 0, dupActs = 0;
    let newPdas = new Set(), dupPdasCount = 0;
    const seenNewPdaThisFile = new Set();

    records.forEach(r => {
      const tKey = r.tema.trim().toLowerCase();
      if (topicNames.has(tKey)) reusedTopics.add(tKey); else newTopics.add(tKey);
      const actKey = tKey+"||"+r.actividad.trim().toLowerCase();
      if (actKeyKnown.has(actKey)) dupActs++; else newActs++;
      if (r.pda) {
        const pKey = r.pda.trim().toLowerCase();
        if (pdaKnown.has(pKey)) dupPdasCount++;
        else { newPdas.add(pKey); seenNewPdaThisFile.add(pKey); }
      }
    });
    return {
      totalRows: records.length,
      newTopicsCount: newTopics.size, reusedTopicsCount: reusedTopics.size,
      newActs, dupActs,
      newPdasCount: newPdas.size, dupPdasCount,
    };
  }, [records, existingTopics, existingPdas]);

  const canShowSelectors = selNivel && selGrado && selAsig;

  return (
    <div style={{position:"fixed", inset:0, background:"#00000088", zIndex:800, display:"flex", alignItems:"center", justifyContent:"center", padding:16}}>
      <div style={{background:"#fff", borderRadius:18, width:"100%", maxWidth:640, maxHeight:"92vh", overflowY:"auto", boxShadow:"0 20px 60px #0005"}}>
        <div style={{background:"linear-gradient(135deg,#7d3c98,#a569bd)", color:"#fff", padding:"18px 22px", borderRadius:"18px 18px 0 0", display:"flex", justifyContent:"space-between", alignItems:"center", position:"sticky", top:0, zIndex:2}}>
          <div>
            <h2 style={{margin:0, fontSize:16, fontWeight:800}}>📥 Carga masiva de Temas, Actividades y PDA's</h2>
            <p style={{margin:"3px 0 0", fontSize:12, opacity:.9}}>{canShowSelectors ? `${selNivel} · ${selGrado} · ${selAsig}` : "Selecciona Nivel, Grado y Asignatura primero"}</p>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.2)", border:"none", color:"#fff", borderRadius:8, padding:"5px 11px", cursor:"pointer", fontSize:14, flexShrink:0}}>✕</button>
        </div>

        <div style={{padding:24}}>
          {!canShowSelectors ? (
            <div style={{textAlign:"center", padding:"30px 10px", color:"#aaa"}}>
              <div style={{fontSize:40}}>🎓</div>
              <p style={{fontSize:13, marginTop:8}}>Cierra esta ventana y elige Nivel, Grado y Asignatura arriba para poder cargar temas.</p>
            </div>
          ) : <>
            <div style={{background:"#faf5ff", border:"1.5px solid #e4d1f0", borderRadius:12, padding:"14px 18px", marginBottom:16}}>
              <p style={{fontSize:12.5, color:"#555", margin:0, lineHeight:1.6}}>
                Sube un archivo <b>.csv</b> con una fila por cada actividad, respetando el orden de campos:
                {" "}<b>Tema → Nombre de la Actividad → Inicio → Desarrollo → Cierre → PDA</b>.
                Si el <b>Tema</b> ya existe se reutiliza (la actividad se agrega dentro), y si el <b>PDA</b> ya existe
                <b> se une a los ya guardados</b> sin duplicarlo ni borrar los anteriores. Puedes cargar todos los temas de la asignatura de una sola vez.
              </p>
              <button onClick={downloadCSVTemplate} style={{marginTop:12, padding:"9px 16px", background:"#fff", color:"#7d3c98", border:"1.5px solid #7d3c98", borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:12.5}}>
                📄 Descargar plantilla CSV
              </button>
            </div>

            <div style={{border:"2px dashed #d0b6e0", borderRadius:12, padding:"20px", textAlign:"center", background:"#fcfaff", marginBottom:16}}>
              <div style={{fontSize:30, marginBottom:6}}>⬆️</div>
              <button onClick={()=>fileRef.current.click()} style={{padding:"10px 20px", background:"#7d3c98", color:"#fff", border:"none", borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:13}}>
                Seleccionar archivo .csv
              </button>
              <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={handleFile} style={{display:"none"}} />
              {fileName && <p style={{marginTop:10, fontSize:12, color:"#666"}}>📎 {fileName}</p>}
            </div>

            {error && <div style={{background:"#fdecea", border:"1px solid #f5c6cb", borderRadius:10, padding:"10px 14px", marginBottom:14, fontSize:12.5, color:"#c0392b"}}>❌ {error}</div>}

            {preview && (
              <div style={{background:"#fff", border:"1.5px solid #e0ecf8", borderRadius:12, padding:"16px 18px", marginBottom:16}}>
                <h4 style={{margin:"0 0 10px", fontSize:13, color:"#0072BB"}}>Vista previa — {preview.totalRows} fila(s) leídas</h4>
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, fontSize:12.5}}>
                  <div style={{background:"#eafaf1", borderRadius:8, padding:"8px 12px"}}>📚 Temas nuevos: <b>{preview.newTopicsCount}</b></div>
                  <div style={{background:"#eaf4fb", borderRadius:8, padding:"8px 12px"}}>♻️ Temas reutilizados: <b>{preview.reusedTopicsCount}</b></div>
                  <div style={{background:"#eafaf1", borderRadius:8, padding:"8px 12px"}}>📋 Actividades nuevas: <b>{preview.newActs}</b></div>
                  <div style={{background:"#fef9e7", borderRadius:8, padding:"8px 12px"}}>⏭️ Actividades duplicadas (se omiten): <b>{preview.dupActs}</b></div>
                  <div style={{background:"#eafaf1", borderRadius:8, padding:"8px 12px"}}>🎯 PDA's nuevos (se unirán): <b>{preview.newPdasCount}</b></div>
                  <div style={{background:"#fef9e7", borderRadius:8, padding:"8px 12px"}}>⏭️ PDA's ya existentes (se omiten): <b>{preview.dupPdasCount}</b></div>
                </div>
              </div>
            )}

            <div style={{display:"flex", gap:10, justifyContent:"flex-end"}}>
              <button onClick={onClose} style={{padding:"10px 18px", background:"#ecf0f1", border:"none", borderRadius:9, cursor:"pointer", fontSize:13}}>Cancelar</button>
              <button onClick={()=>records && onApply(records)} disabled={!records}
                style={{padding:"10px 22px", background:records?"#7d3c98":"#bdc3c7", color:"#fff", border:"none", borderRadius:9, cursor:records?"pointer":"not-allowed", fontWeight:700, fontSize:13}}>
                ✅ Aplicar carga masiva
              </button>
            </div>
          </>}
        </div>
      </div>
    </div>
  );
};

  const getPdas   = () => exs?.[selNivel]?.[selGrado]?.[selAsig+"__pdas"] || [];
  const canShow = selNivel && selGrado && selAsig;

  const selTopicObj = selTopicId ? getTopics().find(t => String(t.id)===String(selTopicId)) : null;
  const activities = selTopicObj?.actividades || [];

  const persist = newExs => { setExs(newExs); setSaved(false); };
  const handleSave = () => { onSave(exs); setSaved(true); };

  const deepSetTopics = newTopics => persist({
    ...exs,
    [selNivel]: {
      ...(exs[selNivel]||{}),
      [selGrado]: {
        ...((exs[selNivel]||{})[selGrado]||{}),
        [selAsig]: newTopics,
      }
    }
  });

  const deepSetPdas = newPdas => persist({
    ...exs,
    [selNivel]: {
      ...(exs[selNivel]||{}),
      [selGrado]: {
        ...((exs[selNivel]||{})[selGrado]||{}),
        [selAsig+"__pdas"]: newPdas,
      }
    }
  });

  const addPda = () => {
    const txt = (newPda||"").trim();
    if (!txt) return;
    deepSetPdas([...getPdas(), {id:Date.now(), texto:txt}]);
    setNewPda("");
  };
  const deletePda = id => {
    if (!confirm("¿Eliminar este PDA?")) return;
    deepSetPdas(getPdas().filter(p => String(p.id)!==String(id)));
  };
  const saveEditPda = () => {
    const txt = (editPda?.texto||"").trim();
    if (!txt) return;
    deepSetPdas(getPdas().map(p => String(p.id)===String(editPda.id) ? {...p,texto:txt} : p));
    setEditPda(null);
  };

  const saveTopic = t => {
    const list = getTopics();
    if (t.id) {
      deepSetTopics(list.map(x => String(x.id)===String(t.id) ? {...x, nombre:t.nombre} : x));
    } else {
      if (list.length >= 100) { alert("Máximo 100 temas."); return; }
      deepSetTopics([...list, {id:Date.now(), nombre:t.nombre, actividades:[]}]);
    }
    setView("topics"); setEditTopic(null);
  };

  const deleteTopic = id => {
    if (!confirm("¿Eliminar este tema y todas sus actividades?")) return;
    deepSetTopics(getTopics().filter(t => String(t.id)!==String(id)));
    if (String(selTopicId)===String(id)) { setSelTopicId(null); setView("topics"); }
  };

  const saveActivity = act => {
    const topics = getTopics();
    const newTopics = topics.map(t => {
      if (String(t.id)!==String(selTopicId)) return t;
      const acts = t.actividades||[];
      const newActs = act.id
        ? acts.map(a => String(a.id)===String(act.id) ? act : a)
        : [...acts, {...act, id:Date.now()}];
      return {...t, actividades: newActs};
    });
    deepSetTopics(newTopics);
    setView("activities"); setEditAct(null);
  };

  const deleteActivity = actId => {
    if (!confirm("¿Eliminar esta actividad?")) return;
    const topics = getTopics().map(t => {
      if (String(t.id)!==String(selTopicId)) return t;
      return {...t, actividades:(t.actividades||[]).filter(a => String(a.id)!==String(actId))};
    });
    deepSetTopics(topics);
  };

  const applyBulkImport = records => {
    const topics = JSON.parse(JSON.stringify(getTopics()));
    const pdas = JSON.parse(JSON.stringify(getPdas()));
    let newTopicsCount = 0, newActsCount = 0, dupActsCount = 0, newPdasCount = 0, dupPdasCount = 0;

    records.forEach(rec => {
      let topic = topics.find(t => t.nombre.trim().toLowerCase() === rec.tema.toLowerCase());
      if (!topic) {
        topic = { id: nextBulkId(), nombre: rec.tema, actividades: [] };
        topics.push(topic);
        newTopicsCount++;
      }
      const already = (topic.actividades||[]).some(a => a.nombre.trim().toLowerCase() === rec.actividad.toLowerCase());
      if (already) {
        dupActsCount++;
      } else {
        topic.actividades = [...(topic.actividades||[]), {
          id: nextBulkId(), nombre: rec.actividad,
          inicio: rec.inicio, desarrollo: rec.desarrollo, cierre: rec.cierre,
        }];
        newActsCount++;
      }
      if (rec.pda) {
        const exists = pdas.some(p => p.texto.trim().toLowerCase() === rec.pda.toLowerCase());
        if (exists) dupPdasCount++;
        else { pdas.push({ id: nextBulkId(), texto: rec.pda }); newPdasCount++; }
      }
    });

    // Se aplican temas/actividades y PDA's en un solo cambio de estado para que
    // ninguno de los dos se sobrescriba entre sí.
    persist({
      ...exs,
      [selNivel]: {
        ...(exs[selNivel]||{}),
        [selGrado]: {
          ...((exs[selNivel]||{})[selGrado]||{}),
          [selAsig]: topics,
          [selAsig+"__pdas"]: pdas,
        }
      }
    });
    setShowBulk(false);
    setBulkResult({ newTopicsCount, newActsCount, dupActsCount, newPdasCount, dupPdasCount });
  };

  const totalTopics = Object.values(exs).reduce((a,nv) =>
    a + Object.values(nv||{}).reduce((b,gv) =>
      b + Object.values(gv||{}).reduce((c,arr) => c+(arr||[]).length,0),0),0);

  const filteredTopics = searchTopic
    ? getTopics().filter(t => t.nombre.toLowerCase().includes(searchTopic.toLowerCase()))
    : getTopics();

  const selStyle = {...S, fontWeight:600, fontSize:13};

  const BreadcrumbBar = () => (
    <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
      <button onClick={()=>{setView("topics");setSelTopicId(null);}} style={{background:"none",border:"none",cursor:"pointer",padding:0,fontSize:12,color:"#0072BB",fontWeight:600}}>
        📚 Temas
      </button>
      {selTopicObj && <>
        <span style={{color:"#bbb"}}>›</span>
        <button onClick={()=>setView("activities")} style={{background:"none",border:"none",cursor:"pointer",padding:0,fontSize:12,color:"#7d3c98",fontWeight:600}}>
          📋 {selTopicObj.nombre}
        </button>
      </>}
      {view==="topic-form" && <><span style={{color:"#bbb"}}>›</span><span style={{fontSize:12,color:"#888"}}>{editTopic?.id?"Editar tema":"Nuevo tema"}</span></>}
      {view==="activity-form" && <><span style={{color:"#bbb"}}>›</span><span style={{fontSize:12,color:"#888"}}>{editAct?.id?"Editar actividad":"Nueva actividad"}</span></>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"#f0f4f8",zIndex:700,display:"flex",flexDirection:"column",fontFamily:"'Segoe UI',sans-serif"}}>

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#1a252f,#2c3e50)",padding:"14px 22px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 2px 12px #0006",flexShrink:0}}>
        <div style={{fontSize:22}}>🔧</div>
        <div style={{flex:1}}>
          <div style={{color:"#fff",fontWeight:800,fontSize:16}}>Panel de Administrador</div>
          <div style={{color:"rgba(255,255,255,.65)",fontSize:12}}>
            Temas y actividades por nivel · <b style={{color:"#1abc9c"}}>{totalTopics}</b> tema(s) registrados
            {!saved && <span style={{marginLeft:10,background:"#e67e22",color:"#fff",fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:700}}>● Cambios sin guardar</span>}
          </div>
        </div>
        <button onClick={handleSave} style={{
          background: saved?"rgba(255,255,255,.15)":"#27ae60",
          border: saved?"1.5px solid rgba(255,255,255,.3)":"none",
          color:"#fff", borderRadius:8, padding:"9px 20px", cursor:"pointer", fontWeight:800, fontSize:13,
          transition:"background .2s"
        }}>
          {saved ? "✅ Guardado" : "💾 Guardar"}
        </button>
        <button onClick={() => {
          if (!saved && !confirm("Tienes cambios sin guardar. ¿Cerrar de todas formas?")) return;
          onClose();
        }} style={{background:"rgba(255,255,255,.15)",border:"1.5px solid rgba(255,255,255,.35)",color:"#fff",borderRadius:8,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>✕ Cerrar</button>
      </div>

      {/* Selectors */}
      <div style={{background:"#fff",borderBottom:"2px solid #e0ecf8",padding:"14px 22px",display:"flex",gap:14,alignItems:"flex-end",flexWrap:"wrap",flexShrink:0}}>
        <div style={{flex:"1 1 150px",minWidth:130}}>
          <label style={{display:"block",fontWeight:700,fontSize:10.5,color:"#0072BB",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>🎓 Nivel</label>
          <select value={selNivel} onChange={e=>{setSelNivel(e.target.value);setSelGrado("");setSelAsig("");setView("topics");setSelTopicId(null);setSearchTopic("");}} style={selStyle}>
            <option value="">— Selecciona —</option>
            <option value="Preescolar">🌸 Preescolar</option>
            <option value="Primaria">🌱 Primaria</option>
            <option value="Secundaria">📘 Secundaria</option>
          </select>
        </div>
        <div style={{flex:"1 1 150px",minWidth:130}}>
          <label style={{display:"block",fontWeight:700,fontSize:10.5,color:"#7d3c98",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>📅 Grado</label>
          <select value={selGrado} onChange={e=>{setSelGrado(e.target.value);setSelAsig("");setView("topics");setSelTopicId(null);setSearchTopic("");}} disabled={!selNivel} style={{...selStyle,background:!selNivel?"#f4f6f8":"#fafcfe"}}>
            <option value="">— Selecciona —</option>
            {gradOpts.map(g => <option key={g} value={g}>{g} Grado</option>)}
          </select>
        </div>
        <div style={{flex:"2 1 220px",minWidth:190}}>
          <label style={{display:"block",fontWeight:700,fontSize:10.5,color:"#1e8449",textTransform:"uppercase",letterSpacing:".5px",marginBottom:5}}>📚 Asignatura</label>
          <select value={selAsig} onChange={e=>{setSelAsig(e.target.value);setView("topics");setSelTopicId(null);setSearchTopic("");}} disabled={!selGrado} style={{...selStyle,background:!selGrado?"#f4f6f8":"#fafcfe"}}>
            <option value="">— Selecciona —</option>
            {CAMPOS.map(cf => (
              <optgroup key={cf.id} label={"── "+cf.label+" ──"}>
                {cf.asignaturas.map(a => {
                  const cnt = exs?.[selNivel]?.[selGrado]?.[a]?.length||0;
                  return <option key={a} value={a}>{a}{cnt>0?" ("+cnt+" temas)":""}</option>;
                })}
              </optgroup>
            ))}
          </select>
        </div>
        {canShow && (
          <div style={{padding:"8px 14px",background:getTopics().length>0?"#eafaf1":"#fef9e7",border:"1.5px solid "+(getTopics().length>0?"#a9dfbf":"#f0c040"),borderRadius:9,fontSize:13,fontWeight:700,color:getTopics().length>0?"#1e8449":"#7d5a00",whiteSpace:"nowrap",alignSelf:"flex-end"}}>
            {getTopics().length} tema(s)
          </div>
        )}
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"auto",padding:22}}>
        {!canShow ? (
          <div style={{textAlign:"center",padding:"80px 20px",color:"#bbb"}}>
            <div style={{fontSize:56,marginBottom:14}}>🎓</div>
            <p style={{fontSize:15,color:"#888"}}>Selecciona Nivel, Grado y Asignatura para gestionar los temas</p>
          </div>
        ) : (
          <div style={{maxWidth:800}}>
            {/* ── Section tabs ── */}
            <div style={{display:"flex",gap:4,marginBottom:18,background:"#e8f0f8",borderRadius:10,padding:4,width:"fit-content"}}>
              {[{k:"topics",label:"📚 Temas y Actividades"},{k:"pdas",label:"🎯 PDAs (Proceso de Aprendizaje)"}].map(t => (
                <button key={t.k} onClick={()=>{setAdminTab(t.k); if(t.k==="topics") setView("topics");}}
                  style={{padding:"8px 18px",border:"none",borderRadius:8,cursor:"pointer",fontWeight:adminTab===t.k?700:500,
                    background:adminTab===t.k?"#fff":"transparent",
                    color:adminTab===t.k?"#0072BB":"#555",
                    boxShadow:adminTab===t.k?"0 1px 4px #0002":"none",fontSize:13,fontFamily:"inherit",transition:"all .15s"}}>
                  {t.label}
                  {t.k==="pdas" && getPdas().length>0 && <span style={{marginLeft:6,background:"#0072BB",color:"#fff",borderRadius:9,fontSize:10,padding:"1px 7px",fontWeight:700}}>{getPdas().length}</span>}
                </button>
              ))}
            </div>

            {/* ── PDA PANEL ── */}
            {adminTab==="pdas" && (
              <div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:10}}>
                  <div>
                    <h3 style={{margin:0,fontSize:15,color:"#0072BB"}}>🎯 PDAs — {selNivel} {selGrado} · {selAsig}</h3>
                    <p style={{margin:"4px 0 0",fontSize:12,color:"#888"}}>Estos PDAs estarán disponibles en el selector de la planeación junto con los predeterminados del sistema.</p>
                  </div>
                  <span style={{background:getPdas().length>0?"#eafaf1":"#fef9e7",border:"1.5px solid "+(getPdas().length>0?"#a9dfbf":"#f0c040"),borderRadius:9,padding:"6px 14px",fontSize:13,fontWeight:700,color:getPdas().length>0?"#1e8449":"#7d5a00"}}>
                    {getPdas().length} PDA(s)
                  </span>
                </div>

                {/* Add PDA form */}
                <div style={{background:"#fff",borderRadius:12,padding:"16px 18px",border:"1.5px solid #d0e8f5",marginBottom:16}}>
                  <label style={{display:"block",fontWeight:700,fontSize:11,color:"#0072BB",textTransform:"uppercase",letterSpacing:".4px",marginBottom:6}}>
                    {editPda ? "✏️ Editar PDA" : "+ Agregar nuevo PDA"}
                  </label>
                  <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                    <textarea
                      value={editPda ? editPda.texto : newPda}
                      onChange={e => editPda ? setEditPda(p=>({...p,texto:e.target.value})) : setNewPda(e.target.value)}
                      placeholder="Ej: Analiza el impacto social y ambiental de las herramientas tecnológicas en la comunidad."
                      rows={2} style={{...S, flex:1, resize:"vertical", lineHeight:1.5}}
                    />
                    {editPda ? (
                      <div style={{display:"flex",flexDirection:"column",gap:6}}>
                        <button onClick={saveEditPda} style={{padding:"8px 16px",background:"#0072BB",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:12,whiteSpace:"nowrap"}}>💾 Guardar</button>
                        <button onClick={()=>setEditPda(null)} style={{padding:"8px 16px",background:"#ecf0f1",border:"none",borderRadius:8,cursor:"pointer",fontSize:12}}>Cancelar</button>
                      </div>
                    ) : (
                      <button onClick={addPda} disabled={!(newPda||"").trim()}
                        style={{padding:"10px 18px",background:(newPda||"").trim()?"#0072BB":"#bdc3c7",color:"#fff",border:"none",borderRadius:8,cursor:(newPda||"").trim()?"pointer":"not-allowed",fontWeight:700,fontSize:13,whiteSpace:"nowrap",alignSelf:"center"}}>
                        + Agregar
                      </button>
                    )}
                  </div>
                </div>

                {/* PDA list */}
                {getPdas().length===0 ? (
                  <div style={{textAlign:"center",padding:"40px 20px",background:"#fff",borderRadius:12,border:"2px dashed #dce6f0",color:"#aaa"}}>
                    <div style={{fontSize:36,marginBottom:8}}>🎯</div>
                    <p style={{fontSize:13}}>Sin PDAs personalizados para {selNivel} {selGrado} · {selAsig}</p>
                    <p style={{fontSize:11,marginTop:4}}>Escribe un PDA arriba y presiona "+ Agregar"</p>
                  </div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {getPdas().map((pda,i) => (
                      <div key={pda.id} style={{background:"#fff",borderRadius:10,padding:"12px 16px",border:"1px solid #e0ecf8",display:"flex",alignItems:"flex-start",gap:12,boxShadow:"0 1px 4px #0072bb08"}}>
                        <div style={{width:30,height:30,borderRadius:8,background:"linear-gradient(135deg,#0072BB,#1abc9c)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:13,flexShrink:0}}>{i+1}</div>
                        <div style={{flex:1,fontSize:13,color:"#2c3e50",lineHeight:1.5}}>{pda.texto}</div>
                        <div style={{display:"flex",gap:6,flexShrink:0}}>
                          <button onClick={()=>setEditPda({...pda})} style={{padding:"5px 12px",background:"#eaf4fb",border:"none",borderRadius:7,cursor:"pointer",fontSize:12,fontWeight:600,color:"#0072BB"}}>✏️</button>
                          <button onClick={()=>deletePda(pda.id)} style={{padding:"5px 10px",background:"#fdf2f2",border:"none",borderRadius:7,cursor:"pointer",fontSize:13,color:"#e74c3c"}}>🗑️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ── TOPICS PANEL ── */}
            {adminTab==="topics" && (<>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{background:"#7d3c98",color:"#fff",borderRadius:7,padding:"3px 10px",fontSize:12,fontWeight:700}}>{selNivel} · {selGrado}</span>
                <span style={{color:"#aaa"}}>›</span>
                <span style={{background:"#0072BB",color:"#fff",borderRadius:7,padding:"3px 10px",fontSize:12,fontWeight:700}}>{selAsig}</span>
                {selTopicObj && <>
                  <span style={{color:"#aaa"}}>›</span>
                  <span style={{background:"#7d3c98",color:"#fff",borderRadius:7,padding:"3px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}} onClick={()=>setView("activities")}>{selTopicObj.nombre}</span>
                </>}
              </div>
              <div style={{display:"flex",gap:8}}>
                {(view==="topics"||view==="activities") && selTopicObj && view==="activities" && (
                  <button onClick={()=>setView("topics")} style={{padding:"8px 16px",background:"#ecf0f1",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>← Temas</button>
                )}
                {view==="topics" && canShow && (
                  <button onClick={()=>{setBulkResult(null);setShowBulk(true);}} style={{padding:"8px 18px",background:"#7d3c98",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>📥 Carga masiva</button>
                )}
                {view==="topics" && canShow && getTopics().length<100 && (
                  <button onClick={()=>{setEditTopic({nombre:""});setView("topic-form");}} style={{padding:"8px 18px",background:"#0072BB",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>+ Nuevo Tema</button>
                )}
                {view==="activities" && selTopicObj && (activities.length<100) && (
                  <button onClick={()=>{setEditAct({nombre:"",inicio:"",desarrollo:"",cierre:"",minInicio:15,minDesarrollo:30,minCierre:10});setView("activity-form");}} style={{padding:"8px 18px",background:"#7d3c98",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13}}>+ Nueva Actividad</button>
                )}
              </div>
            </div>

            {/* ── TOPICS LIST ── */}
            {view==="topics" && (
              <>
                {getTopics().length>4 && (
                  <input value={searchTopic} onChange={e=>setSearchTopic(e.target.value)}
                    placeholder="🔍 Buscar tema..." style={{...S,marginBottom:14,maxWidth:380}} />
                )}
                {/* Progress */}
                {getTopics().length>0 && (
                  <div style={{marginBottom:14}}>
                    <div style={{height:6,background:"#e0ecf8",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:(getTopics().length/100*100)+"%",background:"linear-gradient(90deg,#0072BB,#1abc9c)",borderRadius:4}} />
                    </div>
                    <p style={{fontSize:11,color:"#888",marginTop:3}}>{getTopics().length} de 100 temas</p>
                  </div>
                )}
                {filteredTopics.length===0 ? (
                  <div style={{textAlign:"center",padding:"50px 20px",background:"#fff",borderRadius:14,border:"2px dashed #dce6f0"}}>
                    <div style={{fontSize:44,marginBottom:10}}>📚</div>
                    <p style={{fontSize:14,color:"#aaa"}}>{searchTopic?"Sin resultados":`Sin temas para ${selNivel} ${selGrado} · ${selAsig}`}</p>
                    {!searchTopic && <button onClick={()=>{setEditTopic({nombre:""});setView("topic-form");}} style={{marginTop:14,padding:"10px 24px",background:"#0072BB",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13}}>Crear el primer tema</button>}
                  </div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:10}}>
                    {filteredTopics.map((t,i) => (
                      <div key={t.id} style={{background:"#fff",borderRadius:12,padding:"14px 18px",boxShadow:"0 2px 8px #0072bb0d",border:"1px solid #e8f0f8",display:"flex",alignItems:"center",gap:14}}>
                        <div style={{width:38,height:38,borderRadius:9,background:"linear-gradient(135deg,#0072BB,#1abc9c)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:14,flexShrink:0}}>{i+1}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:14,color:"#2c3e50"}}>{t.nombre}</div>
                          <div style={{fontSize:11,color:"#888",marginTop:3}}>{(t.actividades||[]).length} actividad(es)</div>
                        </div>
                        <div style={{display:"flex",gap:7,flexShrink:0}}>
                          <button onClick={()=>{setSelTopicId(t.id);setView("activities");}} style={{padding:"7px 14px",background:"#f4ecf7",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#7d3c98"}}>📋 Ver actividades</button>
                          <button onClick={()=>{setEditTopic({id:t.id,nombre:t.nombre});setView("topic-form");}} style={{padding:"7px 13px",background:"#eaf4fb",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#0072BB"}}>✏️</button>
                          <button onClick={()=>deleteTopic(t.id)} style={{padding:"7px 11px",background:"#fdf2f2",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,color:"#e74c3c"}}>🗑️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

            {/* ── TOPIC FORM ── */}
            {view==="topic-form" && editTopic && (
              <div style={{background:"#fff",borderRadius:14,padding:"24px",boxShadow:"0 2px 10px #0072bb10",border:"1px solid #e8f0f8",maxWidth:600}}>
                <h3 style={{margin:"0 0 18px",color:"#0072BB",fontSize:15}}>{editTopic.id?"✏️ Editar tema":"📚 Nuevo tema"}</h3>
                <label style={{display:"block",fontWeight:700,fontSize:11,color:"#2c3e50",marginBottom:5,textTransform:"uppercase"}}>Nombre del Tema <span style={{color:"#e74c3c"}}>*</span></label>
                <input value={editTopic.nombre||""} onChange={e=>setEditTopic(t=>({...t,nombre:e.target.value}))}
                  placeholder="Ej: Herramientas y máquinas, Fracciones, Los textos narrativos..."
                  style={{...S,marginBottom:16}} autoFocus />
                <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
                  <button onClick={()=>{setView("topics");setEditTopic(null);}} style={{padding:"10px 20px",background:"#ecf0f1",border:"none",borderRadius:9,cursor:"pointer",fontSize:13}}>Cancelar</button>
                  <button onClick={()=>(editTopic.nombre||"").trim()&&saveTopic(editTopic)} disabled={!(editTopic.nombre||"").trim()}
                    style={{padding:"10px 22px",background:(editTopic.nombre||"").trim()?"#0072BB":"#bdc3c7",color:"#fff",border:"none",borderRadius:9,cursor:(editTopic.nombre||"").trim()?"pointer":"not-allowed",fontWeight:700,fontSize:13}}>
                    💾 {editTopic.id?"Guardar cambios":"Crear tema"}
                  </button>
                </div>
              </div>
            )}

            {/* ── ACTIVITIES LIST ── */}
            {view==="activities" && selTopicObj && (
              <>
                {activities.length>0 && (
                  <div style={{marginBottom:14}}>
                    <div style={{height:6,background:"#f4ecf7",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:(activities.length/100*100)+"%",background:"linear-gradient(90deg,#7d3c98,#a569bd)",borderRadius:4}} />
                    </div>
                    <p style={{fontSize:11,color:"#888",marginTop:3}}>{activities.length} de 100 actividades</p>
                  </div>
                )}
                {activities.length===0 ? (
                  <div style={{textAlign:"center",padding:"50px 20px",background:"#fff",borderRadius:14,border:"2px dashed #e0d0f0"}}>
                    <div style={{fontSize:44,marginBottom:10}}>📋</div>
                    <p style={{fontSize:14,color:"#aaa"}}>Sin actividades en "{selTopicObj.nombre}"</p>
                    <button onClick={()=>{setEditAct({nombre:"",inicio:"",desarrollo:"",cierre:"",minInicio:15,minDesarrollo:30,minCierre:10});setView("activity-form");}} style={{marginTop:14,padding:"10px 24px",background:"#7d3c98",color:"#fff",border:"none",borderRadius:9,cursor:"pointer",fontWeight:700,fontSize:13}}>Crear la primera actividad</button>
                  </div>
                ) : (
                  <div style={{display:"flex",flexDirection:"column",gap:10}}>
                    {activities.map((a,i) => (
                      <div key={a.id} style={{background:"#fff",borderRadius:12,padding:"14px 18px",boxShadow:"0 2px 8px #0072bb0d",border:"1px solid #e8f0f8",display:"flex",alignItems:"flex-start",gap:14}}>
                        <div style={{width:38,height:38,borderRadius:9,background:"linear-gradient(135deg,#7d3c98,#a569bd)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:14,flexShrink:0}}>{i+1}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:14,color:"#2c3e50",marginBottom:4}}>{a.nombre}</div>
                          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                            {a.inicio&&<span style={{background:"#eafaf1",color:"#1e8449",fontSize:10,padding:"2px 8px",borderRadius:8,border:"1px solid #a9dfbf",fontWeight:600}}>🟢 Inicio</span>}
                            {a.desarrollo&&<span style={{background:"#eaf4fb",color:"#0072BB",fontSize:10,padding:"2px 8px",borderRadius:8,border:"1px solid #a8d4f5",fontWeight:600}}>🔵 Desarrollo</span>}
                            {a.cierre&&<span style={{background:"#fdecea",color:"#c0392b",fontSize:10,padding:"2px 8px",borderRadius:8,border:"1px solid #f5b7b1",fontWeight:600}}>🔴 Cierre</span>}
                          </div>
                        </div>
                        <div style={{display:"flex",gap:7,flexShrink:0}}>
                          <button onClick={()=>{setEditAct({...a});setView("activity-form");}} style={{padding:"7px 14px",background:"#eaf4fb",border:"none",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,color:"#0072BB"}}>✏️ Editar</button>
                          <button onClick={()=>deleteActivity(a.id)} style={{padding:"7px 11px",background:"#fdf2f2",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,color:"#e74c3c"}}>🗑️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

            {/* ── ACTIVITY FORM ── */}
            {view==="activity-form" && selTopicObj && editAct && (
              <ActivityForm act={editAct} onSave={saveActivity} onCancel={()=>{setView("activities");setEditAct(null);}} />
            )}
            </>)}
          </div>
        )}
      </div>

      {bulkResult && (
        <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:"#1e8449",color:"#fff",borderRadius:12,padding:"14px 20px",boxShadow:"0 8px 24px #0005",zIndex:900,fontSize:13,display:"flex",alignItems:"center",gap:14,maxWidth:"92vw",flexWrap:"wrap"}}>
          <span>✅ Carga masiva aplicada: <b>{bulkResult.newTopicsCount}</b> tema(s) nuevo(s), <b>{bulkResult.newActsCount}</b> actividad(es) nueva(s)
            {bulkResult.dupActsCount>0 && <> ({bulkResult.dupActsCount} omitida(s) por duplicada(s))</>}, <b>{bulkResult.newPdasCount}</b> PDA(s) unido(s) al banco existente
            {bulkResult.dupPdasCount>0 && <> ({bulkResult.dupPdasCount} ya existían)</>}. Recuerda presionar <b>💾 Guardar</b> arriba.
          </span>
          <button onClick={()=>setBulkResult(null)} style={{background:"rgba(255,255,255,.25)",border:"none",color:"#fff",borderRadius:7,padding:"4px 10px",cursor:"pointer",fontSize:12}}>✕</button>
        </div>
      )}

      {showBulk && (
        <BulkImportModal
          selNivel={selNivel} selGrado={selGrado} selAsig={selAsig}
          existingTopics={getTopics()} existingPdas={getPdas()}
          onApply={applyBulkImport}
          onClose={()=>setShowBulk(false)}
        />
      )}
    </div>
  );
};


/* ── APP ROOT ───────────────────────────────────────────────────────────────── */
function App() {
  const [plans, setPlans] = useCloudState("nes4_plans", []);
  const [exercises, setExercises] = useCloudState("nf_exercises", {});
  const [profile, setProfile] = useCloudState("nes4_profile", { docente:"", escuela:"", cct:"", zonaEscolar:"", municipio:"", estado:"", cicloEscolar:"2024-2025", nivelDefault:"Secundaria", nombreSubdirector:"", cargoSubdirector:"", nombreDirector:"", cargoDirector:"" });
  const [design, setDesign] = useCloudState("nes4_design", { template:"clasico", accentColor:"#1B6CA8", header:{ escuela:true, zona:true, cct:true, ciclo:true } });
  const [customMaterias, setCustomMaterias] = useCloudState("nes4_customMaterias", []);
  const sync = useSyncStatus();

  // Re-aplica materias personalizadas a los catálogos en memoria cuando llegan
  // desde la nube (por ejemplo, en un dispositivo nuevo sin caché local).
  useEffect(() => { applyCustomMaterias(customMaterias); }, [customMaterias]);
  const [current, setCurrent] = useState(null);
  const [showProfile, setShowProfile] = useState(false);
  const [showDesign, setShowDesign] = useState(false);
  const [showImportExport, setShowImportExport] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [printTarget, setPrintTarget] = useState(null);
  const [search, setSearch] = useState("");

  const savePlan = p => setPlans(prev => {
    const i = prev.findIndex(x => x.id===p.id);
    if (i>=0) { const n=[...prev]; n[i]=p; return n; }
    return [p, ...prev];
  });
  const delPlan = id => { if (confirm("¿Eliminar esta planeación?")) setPlans(p=>p.filter(x=>x.id!==id)); };

  if (showAdmin) return <AdminPanel exercises={exercises} onSave={setExercises} onClose={() => setShowAdmin(false)} />;

  if (current) return (
    <>
      <PlanForm plan={current} onSave={savePlan} onBack={() => setCurrent(null)} onPrint={setPrintTarget} exercises={exercises} />
      {printTarget && <PrintModal p={printTarget} design={design} setDesign={setDesign} onClose={() => setPrintTarget(null)} />}
      {showDesign && <DesignModal design={design} onSave={setDesign} onClose={() => setShowDesign(false)} />}
    </>
  );

  const filtered = plans.filter(p =>
    !search || [p.titulo,p.nivel,p.grado,p.grupo,p.asignatura,p.campoFormativo,p.escenario].join(" ").toLowerCase().includes(search.toLowerCase())
  );
  const niv = Object.keys(NIVELES).map(n => ({n, cnt:plans.filter(p=>p.nivel===n).length})).filter(x=>x.cnt>0);

  return (
    <div style={{minHeight:"100vh", background:"linear-gradient(160deg,#eaf2fb 0%,#fdfffe 60%,#eafaf1 100%)", fontFamily:"'Segoe UI',sans-serif"}}>
      <div style={{background:"linear-gradient(135deg,#0072BB 0%,#1abc9c 100%)", padding:"22px 20px 18px", color:"#fff"}}>
        <div style={{maxWidth:860, margin:"0 auto", display:"flex", alignItems:"flex-start", justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:28, marginBottom:2}}>📋</div>
            <h1 style={{margin:0, fontSize:20, fontWeight:800}}>Planea Fácil</h1>
            <p style={{margin:"3px 0 0", fontSize:12, opacity:.8}}>Nueva Escuela Mexicana · Plan de Estudios 2022</p>
            {profile.escuela && <p style={{margin:"5px 0 0", fontSize:12, opacity:.75}}>🏫 {profile.escuela}{profile.docente&&" · "+profile.docente}</p>}
            <p style={{margin:"5px 0 0", fontSize:11, opacity:.75, display:"flex", alignItems:"center", gap:5}}>
              {sync.error ? <>⚠️ Sin conexión con la nube (guardando local)</> : sync.pending>0 ? <>☁️ Guardando…</> : <>☁️ Sincronizado</>}
            </p>
          </div>
          <div style={{display:"flex", gap:8, flexDirection:"column", alignItems:"flex-end"}}>
            <button onClick={() => setShowProfile(true)} style={{background:"rgba(255,255,255,.2)", border:"1.5px solid rgba(255,255,255,.4)", color:"#fff", borderRadius:10, padding:"9px 16px", cursor:"pointer", fontSize:13, fontWeight:600}}>
              ⚙️ Mi Perfil
            </button>
            <button onClick={() => setShowDesign(true)} style={{background:"rgba(255,255,255,.2)", border:"1.5px solid rgba(255,255,255,.4)", color:"#fff", borderRadius:10, padding:"9px 16px", cursor:"pointer", fontSize:13, fontWeight:600}}>
              🎨 Diseño del Documento
            </button>
            <button onClick={() => setShowAdmin(true)} style={{background:"rgba(255,255,255,.25)", border:"1.5px solid rgba(255,255,255,.5)", color:"#fff", borderRadius:10, padding:"8px 15px", cursor:"pointer", fontSize:13, fontWeight:700}}>
              🔧 Administrador
            </button>
            <button onClick={() => setShowImportExport(true)} style={{background:"rgba(255,255,255,.15)", border:"1.5px solid rgba(255,255,255,.3)", color:"#fff", borderRadius:10, padding:"7px 14px", cursor:"pointer", fontSize:12}}>
              🗄️ Importar / Exportar
            </button>
          </div>
        </div>
      </div>

      <div style={{maxWidth:860, margin:"0 auto", padding:"20px 14px"}}>
        {!profile.escuela && (
          <div style={{background:"#fff8e6", border:"1.5px solid #f0c040", borderRadius:12, padding:"14px 18px", marginBottom:18, display:"flex", gap:12, alignItems:"center"}}>
            <span style={{fontSize:24}}>👋</span>
            <div>
              <strong style={{color:"#7d5a00", fontSize:14}}>¡Bienvenido! Configura tu perfil primero</strong>
              <p style={{margin:"3px 0 0", fontSize:12.5, color:"#8c6d00"}}>Guarda los datos de tu institución para llenado automático.</p>
            </div>
            <button onClick={() => setShowProfile(true)} style={{marginLeft:"auto", padding:"8px 16px", background:"#f0c040", border:"none", borderRadius:8, cursor:"pointer", fontWeight:700, fontSize:13, whiteSpace:"nowrap"}}>Configurar</button>
          </div>
        )}

        <div style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:10, marginBottom:16}}>
          {[
            {icon:"📄", val:plans.length, lbl:"Planeaciones"},
            {icon:"📚", val:[...new Set(plans.map(p=>p.asignatura).filter(Boolean))].length, lbl:"Asignaturas"},
            {icon:"🏠", val:[...new Set(plans.map(p=>p.escenario).filter(Boolean))].join(", ")||"—", lbl:"Escenarios", sm:true},
            {icon:"🎓", val:niv.map(x=>x.n.slice(0,3)+"("+x.cnt+")").join(" ")||"—", lbl:"Niveles", sm:true},
          ].map(s => (
            <div key={s.lbl} style={{background:"#fff", borderRadius:12, padding:"12px 10px", textAlign:"center", boxShadow:"0 2px 8px #0072bb12", border:"1px solid #e0ecf8"}}>
              <div style={{fontSize:20}}>{s.icon}</div>
              <div style={{fontSize:s.sm?11:22, fontWeight:800, color:"#0072BB", lineHeight:1.2, marginTop:2}}>{s.val}</div>
              <div style={{fontSize:10, color:"#7f8c8d", textTransform:"uppercase", marginTop:2}}>{s.lbl}</div>
            </div>
          ))}
        </div>

        <div style={{display:"flex", gap:10, marginBottom:16}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Buscar por asignatura, nivel, escenario..."
            style={{flex:1, padding:"10px 14px", border:"1.5px solid #dce6f0", borderRadius:10, fontSize:13, fontFamily:"inherit", background:"#fff", outline:"none"}} />
          <button onClick={() => setCurrent(emptyPlan(profile))} style={{padding:"10px 20px", background:"#0072BB", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:700, fontSize:13, whiteSpace:"nowrap"}}>
            + Nueva Planeación
          </button>
        </div>

        {filtered.length===0 ? (
          <div style={{textAlign:"center", padding:"50px 20px", color:"#aaa"}}>
            <div style={{fontSize:50}}>📝</div>
            <p style={{fontSize:15}}>{search ? "No se encontraron resultados" : "Aún no tienes planeaciones"}</p>
            {!search && <button onClick={() => setCurrent(emptyPlan(profile))} style={{marginTop:10, padding:"10px 22px", background:"#0072BB", color:"#fff", border:"none", borderRadius:10, cursor:"pointer", fontWeight:700}}>Crear mi primera planeación</button>}
          </div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:10}}>
            {filtered.map(p => (
              <div key={p.id} style={{background:"#fff", borderRadius:13, padding:"13px 16px", boxShadow:"0 2px 8px #0072bb10", border:"1px solid #e0ecf8", display:"flex", alignItems:"center", gap:12}}>
                <div style={{width:44, height:44, borderRadius:10, background:p.nivel==="Preescolar"?"linear-gradient(135deg,#f39c12,#e67e22)":p.nivel==="Primaria"?"linear-gradient(135deg,#27ae60,#1abc9c)":"linear-gradient(135deg,#0072BB,#2980b9)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, flexShrink:0}}>
                  {p.nivel==="Preescolar"?"🌸":p.nivel==="Primaria"?"🌱":"📘"}
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontWeight:700, fontSize:14, color:"#0072BB", marginBottom:2}}>{p.titulo||"Sin título"}</div>
                  <div style={{fontSize:12, color:"#7f8c8d"}}>{[p.nivel,p.grado&&p.grado+" Grado",p.grupo&&"Grupo \""+p.grupo+"\"",p.asignatura].filter(Boolean).join(" · ")}</div>
                  <div style={{marginTop:4, display:"flex", flexWrap:"wrap", gap:4}}>
                    {p.escenario && <span style={{background:"#f0faf6", color:"#1e8449", fontSize:10, padding:"2px 8px", borderRadius:9, fontWeight:600, border:"1px solid #a9dfbf"}}>📍 {p.escenario}</span>}
                    {p.bloque && <span style={{background:"#eaf4fb", color:"#0072BB", fontSize:10, padding:"2px 8px", borderRadius:9, fontWeight:600}}>{p.bloque}</span>}
                    {p.trimestre && <span style={{background:"#f4ecf7", color:"#7d3c98", fontSize:10, padding:"2px 8px", borderRadius:9, fontWeight:600}}>{p.trimestre}</span>}
                    {(p.ejesArticuladores||[]).slice(0,2).map(e => <span key={e} style={{background:"#fef9e7", color:"#7d6608", fontSize:10, padding:"2px 8px", borderRadius:9, fontWeight:600}}>{e}</span>)}
                  </div>
                </div>
                <div style={{display:"flex", gap:6, flexShrink:0}}>
                  <button onClick={() => setPrintTarget(p)} style={{padding:"7px 10px", background:"#eaf4fb", border:"none", borderRadius:7, cursor:"pointer", fontSize:14}}>🖨️</button>
                  <button onClick={() => setCurrent(p)} style={{padding:"7px 13px", background:"#0072BB", color:"#fff", border:"none", borderRadius:7, cursor:"pointer", fontSize:12, fontWeight:600}}>Editar</button>
                  <button onClick={() => delPlan(p.id)} style={{padding:"7px 10px", background:"#fdf2f2", border:"none", borderRadius:7, cursor:"pointer", fontSize:14, color:"#e74c3c"}}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      {showProfile && <ProfileModal profile={profile} onSave={setProfile} onClose={() => setShowProfile(false)} />}
      {showDesign && <DesignModal design={design} onSave={setDesign} onClose={() => setShowDesign(false)} />}
      {showImportExport && <ImportExportModal plans={plans} onImport={setPlans} customMaterias={customMaterias} onCustomMateriasChange={setCustomMaterias} onClose={() => setShowImportExport(false)} />}
      {printTarget && <PrintModal p={printTarget} design={design} setDesign={setDesign} onClose={() => setPrintTarget(null)} />}
    </div>
  );
}


// ── RENDER ──────────────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
